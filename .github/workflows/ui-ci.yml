name: Single Window UI CI

on:
  push:
    branches:
      - feature/single-window-ui
  pull_request:
    branches:
      - main
      - feature/single-window-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore YacaPluginSwitcher.sln

      - name: Static preflight
        shell: pwsh
        run: .\scripts\preflight.ps1

      - name: Build Release
        run: dotnet build YacaPluginSwitcher.sln -c Release --no-restore --no-incremental
