name: Single Window UI CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore YacaPluginSwitcher.sln

      - name: Static preflight
        shell: pwsh
        run: .\scripts\preflight.ps1

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build YacaPluginSwitcher.sln -c Release --no-restore --no-incremental *> build.log
          Get-Content build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: single-window-ui-build-log
          path: build.log
          if-no-files-found: warn
