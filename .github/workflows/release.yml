name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          $version = $tag.Substring(1)
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore
        run: dotnet restore YacaPluginSwitcher.sln

      - name: Static preflight
        shell: pwsh
        run: .\scripts\preflight.ps1

      - name: Build and package
        run: >-
          dotnet publish src/YacaPluginSwitcher/YacaPluginSwitcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.RELEASE_VERSION }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false
          -p:YacaReleasePackaging=true
          --no-restore

      - name: Validate user package and checksum
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'releases'
          $zip = Get-ChildItem $releaseDir -Filter 'YacaPluginSwitcher-v*-win-x64.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $zip) { throw 'No user-ready release ZIP was generated.' }

          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $files = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            $exe = @($files | Where-Object { $_.Name -match '(?i)\.exe$' })
            $forbidden = @($files | Where-Object { $_.Name -match '(?i)\.(pdb|dll|deps\.json|runtimeconfig\.json)$' })
            if ($exe.Count -ne 1) { throw "User package must contain exactly one EXE; found $($exe.Count)." }
            if ($forbidden.Count -ne 0) { throw "Forbidden files in user package: $($forbidden.Name -join ', ')" }
          }
          finally { $archive.Dispose() }

          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $shaPath = "$($zip.FullName).sha256"
          "$hash  $($zip.Name)" | Set-Content -LiteralPath $shaPath -Encoding ascii
          "RELEASE_ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_SHA=$shaPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_SHA --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_SHA --title "Yaca Plugin Switcher $env:RELEASE_TAG" --generate-notes
          }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v6
        with:
          name: YacaPluginSwitcher-${{ env.RELEASE_VERSION }}-win-x64
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_SHA }}
          if-no-files-found: error
